<div id="login" class="card"><img class="logo" src="/assets/logo.svg" alt="" onerror="this.remove()"><h2>Admin login</h2><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p class="msg" id="lm"></p><button class="b" id="lb">Sign in</button></div>
<div id="app" hidden><div id="hb" class="hb" hidden></div><header><span class="brand"><img class="logo" src="/assets/logo.svg" alt="" onerror="this.remove()"><b>CYBER ENTERTAINMENT<small>Admin Panel <span id="sk" class="tag ok" hidden></span></small></b></span><nav id="nv"><button data-t="bookings" class="on">Bookings</button><button data-t="subscribers">Subscribers</button><button data-t="events">Events</button><button data-t="news">News</button><button data-t="djs">DJs</button><button data-t="mixtapes">Mixtapes</button><button data-t="shirts">T-shirts</button><button data-t="gear">Gear</button><button data-t="lists">Academy &amp; packages</button><button data-t="pages">Pages &amp; text</button><button data-t="faq">FAQ</button><button data-t="gallery">Gallery</button><button data-t="media">Media</button><button data-t="settings">Settings</button><button data-t="backup">Backup</button><button data-t="account">Account</button><button id="out">Log out</button></nav></header><main id="m"></main></div>
<script>

const shrink=f=>new Promise(res=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5e6)return res(f);const im=new Image(),u=URL.createObjectURL(f);

// returns {url,file}
async function uploadFile(f,prog){

  const t=await call('/api/admin/upload-url','POST',{name:f.name,size:f.size});
  const fd=new FormData();fd.append('cacheControl','31536000');fd.append('',f);
  await xhr('PUT',t.uploadUrl,fd,t.apikey?{apikey:t.apikey}:{},prog);
  return{url:t.url,file:t.file}}

 m.append(h('div',{className:'card'},h('h2',{},'Bookings ',h('span',{className:'tag'},n+' new')),h('select',{'data-nm':1,style:'width:auto;margin-right:8px',onchange:e=>{flt=e.target.value;draw()}},h('option',{value:''},'All statuses'),ST.map(s=>h('option',{value:s,selected:s===flt},s))),h('a',{className:'b',href:'/api/admin/bookings.csv'},'Export CSV'),' ',h('button',{className:'b g',onclick:()=>add.hidden=!add.hidden},'+ Add booking'),add,

  h('div',{className:'sep'},h('input',{value:x.description||'',oninput:e=>x.description=e.target.value,placeholder:'Short description (shown on the event card)'})))});
 if(!D.events.length)c.append(h('p',{},'No events yet — press “+ Add event” to create your first one.'));
 const s=h('span',{className:'msg ok'});c.append(h('button',{className:'b g',onclick:()=>{D.events.unshift({id:'',title:'',date:'',time:'',venue:'',description:'',lineup:'',price:'',ticketUrl:'',image:'',status:'upcoming',available:true});draw()}},'+ Add event'),' ',saveBtn('Save events',async()=>{D.events=await call('/api/admin/events','PUT',{events:D.events});sortEv();dirty.delete(tab);flash=' Saved ✓';draw()},s),s);m.append(c)}
function news(m){const live=D.news.filter(x=>x.available).length,c=h('div',{className:'card'},h('h2',{},'News ',h('span',{className:'tag'},live+' live on site')),
 h('p',{className:'hint'},'Announcements for the News page: new mixtapes, event recaps, studio updates. The newest post is shown first and large. Untick “Available” to hide a post.'));
 D.news.forEach((x,i)=>{const im=h('input',{value:x.image||'',oninput:e=>x.image=e.target.value,placeholder:'Photo link or upload (optional)'});
  c.append(h('div',{className:'row nw'},h('input',{value:x.title,oninput:e=>x.title=e.target.value,placeholder:'Headline'}),h('input',{type:'date',value:x.date||'',onchange:e=>x.date=e.target.value}),h('input',{value:x.link||'',oninput:e=>x.link=e.target.value,placeholder:'Read-more link (optional, https://…)'}),avail(x),
